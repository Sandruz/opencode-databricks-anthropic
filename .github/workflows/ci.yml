name: CI

on:
  push:
  pull_request:

# CI validates only. No package or identity-token write permission is granted.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Stable major tags receive upstream security fixes without manual SHA churn.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run check
